title = "IAM Platform Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore safe mock tokens and placeholders"
paths = [
    '''\.env\.example''',
     '''api/secrets/.*''',
    '''api/keys/.*'''
]

# ==============================
# 🔐 CUSTOM RULES 
# ==============================

# INTERNAL SERVICE TOKEN
[[rules]]
id = "internal-service-token"
description = "Detect INTERNAL_SERVICE_TOKEN"
regex = '''INTERNAL_SERVICE_TOKEN\s*=\s*[a-zA-Z0-9_\-]{16,}'''
tags = ["internal", "token"]

# GOOGLE OAUTH CLIENT SECRET
[[rules]]
id = "google-client-secret"
description = "Detect Google OAuth client secret"
regex = '''GOOGLE_CLIENT_SECRET\s*=\s*[a-zA-Z0-9\-_]{20,}'''
tags = ["oauth", "google"]

# GENERIC API KEY / SECRET / TOKEN
[[rules]]
id = "generic-secrets"
description = "Detect generic secrets"
regex = '''(?i)(api[_-]?key|secret|token|password)\s*=\s*["']?[a-zA-Z0-9_\-]{10,}["']?'''
tags = ["generic"]

# DATABASE URL (Postgres)
[[rules]]
id = "database-url"
description = "Detect PostgreSQL connection string"
regex = '''postgresql:\/\/[^\s]+'''
tags = ["database"]

# REDIS URL
[[rules]]
id = "redis-url"
description = "Detect Redis connection string"
regex = '''redis:\/\/[^\s]+'''
tags = ["database"]

# JWT PRIVATE KEY (PEM format)
[[rules]]
id = "jwt-private-key"
description = "Detect JWT private key"
regex = '''-----BEGIN PRIVATE KEY-----'''
tags = ["jwt", "private-key"]

# ENCRYPTION KEY (32+ hex chars)
[[rules]]
id = "encryption-key"
description = "Detect encryption keys"
regex = '''ENCRYPTION_KEY_[A-Z0-9_]*\s*=\s*[a-fA-F0-9]{32,}'''
tags = ["encryption"]

# KID-BASED JWT KEYS
[[rules]]
id = "jwt-kid-keys"
description = "Detect KID-based JWT keys"
regex = '''JWT_KEY_[A-Z0-9_]+_(PRIVATE|PUBLIC)\s*=\s*.+'''
tags = ["jwt"]