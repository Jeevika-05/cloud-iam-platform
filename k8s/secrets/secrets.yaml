# ─────────────────────────────────────────────────────────────
# Secrets — All credentials referenced by workloads via secretKeyRef
# IMPORTANT: In production, use SealedSecrets or External Secrets Operator.
#            Replace placeholder values before deploying.
# ─────────────────────────────────────────────────────────────

# ── Backend namespace secrets ────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: backend
  labels:
    app: postgres
    project: cloud-iam-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  POSTGRES_DB: "authdb"
  # ⚠️ SYNC WARNING: The password below MUST match POSTGRES_PASSWORD above.
  # K8s secrets don't support variable interpolation — update both together.
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_postgres_password@postgres:5432/authdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: backend
  labels:
    app: redis
    project: cloud-iam-platform
type: Opaque
stringData:
  REDIS_URL: "redis://redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: backend
  labels:
    app: neo4j
    project: cloud-iam-platform
type: Opaque
stringData:
  NEO4J_URL: "bolt://neo4j.security-graph.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME_neo4j_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: encryption-keys
  namespace: backend
  labels:
    project: cloud-iam-platform
type: Opaque
stringData:
  ACTIVE_KEY_VERSION: "2"
  ENCRYPTION_KEY_V1: "CHANGE_ME_replace_with_64_char_hex_key_v1"
  ENCRYPTION_KEY_V2: "CHANGE_ME_replace_with_64_char_hex_key_v2"
---
apiVersion: v1
kind: Secret
metadata:
  name: internal-service-token
  namespace: backend
  labels:
    project: cloud-iam-platform
type: Opaque
stringData:
  INTERNAL_SERVICE_TOKEN: "CHANGE_ME_generate_with_crypto_randomBytes_32_hex"
---
apiVersion: v1
kind: Secret
metadata:
  name: google-oauth-credentials
  namespace: backend
  labels:
    project: cloud-iam-platform
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "CHANGE_ME_google_client_id"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME_google_client_secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: seed-credentials
  namespace: backend
  labels:
    project: cloud-iam-platform
type: Opaque
stringData:
  SEED_ADMIN_PASSWORD: "CHANGE_ME_admin_password"
  SEED_ANALYST_PASSWORD: "CHANGE_ME_analyst_password"
  SEED_USER_PASSWORD: "CHANGE_ME_user_password"
---
# ── Monitoring namespace secrets ─────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
  labels:
    app: grafana
    project: cloud-iam-platform
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_grafana_admin_password"
---
# ── Security-Graph namespace secrets ─────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-credentials
  namespace: security-graph
  labels:
    app: neo4j
    project: cloud-iam-platform
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/CHANGE_ME_neo4j_password"
---
# ── Attack-Sim namespace secrets ─────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: attack-sim-credentials
  namespace: attack-sim
  labels:
    app: attack-sim
    project: cloud-iam-platform
type: Opaque
stringData:
  ATTACK_EMAIL: "attacker@test.com"
  ATTACK_PASSWORD: "CHANGE_ME_attack_password"
