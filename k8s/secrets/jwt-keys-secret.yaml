# ─────────────────────────────────────────────────────────────
# JWT RS256 Key Pairs — Multi-key rotation support
# IMPORTANT: Replace placeholder values with actual PEM key contents.
#   Generate keys with:
#     openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
#     openssl rsa -in private.pem -pubout -out public.pem
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: backend
  labels:
    app: backend-api
    project: cloud-iam-platform
type: Opaque
stringData:
  # Key pair 1 (active by default — controlled by JWT_ACTIVE_KID)
  key1-private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_KEY1_PRIVATE_PEM_CONTENT
    -----END PRIVATE KEY-----
  key1-public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ACTUAL_KEY1_PUBLIC_PEM_CONTENT
    -----END PUBLIC KEY-----
  # Key pair 2 (rotation target)
  key2-private.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_ACTUAL_KEY2_PRIVATE_PEM_CONTENT
    -----END PRIVATE KEY-----
  key2-public.pem: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ACTUAL_KEY2_PUBLIC_PEM_CONTENT
    -----END PUBLIC KEY-----
