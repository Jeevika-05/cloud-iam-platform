# ─────────────────────────────────────────────────────────────
# Backend API — Cloud IAM Security Platform
# 2 replicas, non-root, resource limits, NodePort service
# ─────────────────────────────────────────────────────────────

# ── ServiceAccount ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api-sa
  namespace: backend
  labels:
    app: backend-api
    project: cloud-iam-platform
automountServiceAccountToken: false
---
# ── Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: backend
  labels:
    app: backend-api
    tier: api
    project: cloud-iam-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        tier: api
        project: cloud-iam-platform
    spec:
      serviceAccountName: backend-api-sa
      automountServiceAccountToken: false
      # ── Pod-level security context ──
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend-api
          image: cloud-iam-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["dumb-init", "--"]
          args: ["node", "src/server.js"]
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          # ── Container-level security context ──
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # ── Resource limits ──
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # ── Environment from ConfigMap ──
          envFrom:
            - configMapRef:
                name: backend-config
          # ── Secrets injected individually ──
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_URL
            - name: NEO4J_URL
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URL
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-service-token
                  key: INTERNAL_SERVICE_TOKEN
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth-credentials
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth-credentials
                  key: GOOGLE_CLIENT_SECRET
            - name: ACTIVE_KEY_VERSION
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: ACTIVE_KEY_VERSION
            - name: ENCRYPTION_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: ENCRYPTION_KEY_V1
            - name: ENCRYPTION_KEY_V2
              valueFrom:
                secretKeyRef:
                  name: encryption-keys
                  key: ENCRYPTION_KEY_V2
          # ── JWT key files volume mount ──
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          # ── Health probes ──
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0440
---
# ── Service (NodePort) — External access ────────────────────
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: backend
  labels:
    app: backend-api
    project: cloud-iam-platform
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
      name: http
