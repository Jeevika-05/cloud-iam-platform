# ─────────────────────────────────────────────────────────────
# Prometheus — Metrics collection & alerting
# Scrapes backend API, event-worker, defense-worker
# ─────────────────────────────────────────────────────────────

# ── ServiceAccount ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: monitoring
  labels:
    app: prometheus
    project: cloud-iam-platform
automountServiceAccountToken: false
---
# ── ConfigMap — prometheus.yml ───────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    project: cloud-iam-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # ── Backend API metrics (port 3000) ──
      - job_name: 'iam-backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['backend-api.backend.svc.cluster.local:3000']
            labels:
              namespace: backend
              component: api

      # ── Event Worker metrics (port 9091) ──
      - job_name: 'iam-event-worker'
        metrics_path: /metrics
        static_configs:
          - targets: ['event-worker.backend.svc.cluster.local:9091']
            labels:
              namespace: backend
              component: event-worker

      # ── Defense Worker metrics (port 9092) ──
      - job_name: 'iam-defense-worker'
        metrics_path: /metrics
        static_configs:
          - targets: ['defense-worker.backend.svc.cluster.local:9092']
            labels:
              namespace: backend
              component: defense-worker
---
# ── Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    project: cloud-iam-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        project: cloud-iam-platform
    spec:
      serviceAccountName: prometheus-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534          # nobody
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
          ports:
            - containerPort: 9090
              protocol: TCP
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-storage
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-storage
          emptyDir:
            sizeLimit: 5Gi
---
# ── Service (NodePort) ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    project: cloud-iam-platform
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
      name: http
