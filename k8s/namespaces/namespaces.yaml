# ─────────────────────────────────────────────────────────────
# Namespace Isolation for Cloud IAM Security Platform
# Four isolated namespaces with explicit labels for NetworkPolicy selectors
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    name: backend
    project: cloud-iam-platform
    environment: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    project: cloud-iam-platform
    environment: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: attack-sim
  labels:
    name: attack-sim
    project: cloud-iam-platform
    environment: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: security-graph
  labels:
    name: security-graph
    project: cloud-iam-platform
    environment: production
