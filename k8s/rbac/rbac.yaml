# ═════════════════════════════════════════════════════════════
# RBAC — Least-privilege access control
# ServiceAccounts, Roles, RoleBindings per namespace
# ═════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# 1. BACKEND NAMESPACE — Minimal pod permissions
# ─────────────────────────────────────────────────────────────

# ── Role: backend pods can only read their own configmaps/secrets ──
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-pod-role
  namespace: backend
  labels:
    project: cloud-iam-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backend-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - postgres-credentials
      - redis-credentials
      - neo4j-credentials
      - encryption-keys
      - internal-service-token
      - google-oauth-credentials
      - jwt-keys
    verbs: ["get"]
---
# ── RoleBinding: backend-api → backend-pod-role ──
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-api-binding
  namespace: backend
  labels:
    project: cloud-iam-platform
subjects:
  - kind: ServiceAccount
    name: backend-api-sa
    namespace: backend
roleRef:
  kind: Role
  name: backend-pod-role
  apiGroup: rbac.authorization.k8s.io
---
# ── RoleBinding: event-worker → backend-pod-role ──
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: event-worker-binding
  namespace: backend
  labels:
    project: cloud-iam-platform
subjects:
  - kind: ServiceAccount
    name: event-worker-sa
    namespace: backend
roleRef:
  kind: Role
  name: backend-pod-role
  apiGroup: rbac.authorization.k8s.io
---
# ── RoleBinding: defense-worker → backend-pod-role ──
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defense-worker-binding
  namespace: backend
  labels:
    project: cloud-iam-platform
subjects:
  - kind: ServiceAccount
    name: defense-worker-sa
    namespace: backend
roleRef:
  kind: Role
  name: backend-pod-role
  apiGroup: rbac.authorization.k8s.io
---

# ─────────────────────────────────────────────────────────────
# 2. MONITORING NAMESPACE — Prometheus read-only
# ─────────────────────────────────────────────────────────────

# ── Role: monitoring pods can read their configmaps ──
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-pod-role
  namespace: monitoring
  labels:
    project: cloud-iam-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - prometheus-config
      - grafana-datasource
      - grafana-dashboard-provider
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-binding
  namespace: monitoring
  labels:
    project: cloud-iam-platform
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: monitoring
roleRef:
  kind: Role
  name: monitoring-pod-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-binding
  namespace: monitoring
  labels:
    project: cloud-iam-platform
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: monitoring
roleRef:
  kind: Role
  name: monitoring-pod-role
  apiGroup: rbac.authorization.k8s.io
---

