services:
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: authdb
    restart: unless-stopped
    env_file:
      - .env.config
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.config
    environment:
      SECRET_PROVIDER: docker-secrets
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - ./secrets:/run/secrets:ro
      - ./keys/key1/private.pem:/run/secrets/JWT_KEY_KEY1_PRIVATE:ro
      - ./keys/key1/public.pem:/run/secrets/JWT_KEY_KEY1_PUBLIC:ro
      - ./keys/key2/private.pem:/run/secrets/JWT_KEY_KEY2_PRIVATE:ro
      - ./keys/key2/public.pem:/run/secrets/JWT_KEY_KEY2_PUBLIC:ro
      - ./keys/jwt_private.pem:/run/secrets/JWT_PRIVATE_KEY:ro
      - ./keys/jwt_public.pem:/run/secrets/JWT_PUBLIC_KEY:ro
      - ./keys/encryption_v1.key:/run/secrets/ENCRYPTION_KEY_V1:ro
      - ./keys/encryption_v2.key:/run/secrets/ENCRYPTION_KEY_V2:ro
    command: npm run dev
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_worker
    restart: unless-stopped
    command: npm run worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env.config
    environment:
      SECRET_PROVIDER: docker-secrets
    ports:
      - '9091:9091'
    volumes:
      - .:/app
      - /app/node_modules
      - ./secrets:/run/secrets:ro
      - ./keys/key1/private.pem:/run/secrets/JWT_KEY_KEY1_PRIVATE:ro
      - ./keys/key1/public.pem:/run/secrets/JWT_KEY_KEY1_PUBLIC:ro
      - ./keys/key2/private.pem:/run/secrets/JWT_KEY_KEY2_PRIVATE:ro
      - ./keys/key2/public.pem:/run/secrets/JWT_KEY_KEY2_PUBLIC:ro
      - ./keys/encryption_v1.key:/run/secrets/ENCRYPTION_KEY_V1:ro
      - ./keys/encryption_v2.key:/run/secrets/ENCRYPTION_KEY_V2:ro
    networks:
      - backend

  defense_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_defense_worker
    restart: unless-stopped
    command: npm run worker:defense
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    env_file:
      - .env.config
    environment:
      SECRET_PROVIDER: docker-secrets
    ports:
      - '9092:9092'
    volumes:
      - .:/app
      - /app/node_modules
      - ./secrets:/run/secrets:ro
      - ./keys/key1/private.pem:/run/secrets/JWT_KEY_KEY1_PRIVATE:ro
      - ./keys/key1/public.pem:/run/secrets/JWT_KEY_KEY1_PUBLIC:ro
      - ./keys/key2/private.pem:/run/secrets/JWT_KEY_KEY2_PRIVATE:ro
      - ./keys/key2/public.pem:/run/secrets/JWT_KEY_KEY2_PUBLIC:ro
      - ./keys/encryption_v1.key:/run/secrets/ENCRYPTION_KEY_V1:ro
      - ./keys/encryption_v2.key:/run/secrets/ENCRYPTION_KEY_V2:ro
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: auth_migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.config
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-authdb}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    networks:
      - backend

  attacker:
    profiles: ["attack"]
    build:
      context: ../simulation-engine/cloudshield-attacker
      dockerfile: Dockerfile
    
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TARGET_URL: http://backend:3000
      ATTACK_EMAIL: ${ATTACK_EMAIL:-attacker@test.com}
      ATTACK_PASSWORD: ${ATTACK_PASSWORD:-Attack@123}
      ATTACK_MODE: ${ATTACK_MODE:-all}
    volumes:
      - ./reports:/reports
    networks:
      - backend
    restart: "no"

  #  Attack ingestion (results.json → Redis)
  attack-ingest:
    profiles: ["attack"]
    build:
      context: .
      dockerfile: Dockerfile
    command: node scripts/ingestAttackEvents.js --file /app/reports/results.json
    depends_on:
      redis:
        condition: service_healthy
      attacker:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
      - ./reports:/app/reports
    networks:
      - backend
    restart: "no"



  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend
    depends_on:
      - backend
      - worker
      - defense_worker

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus

  neo4j:
    image: neo4j:5
    container_name: auth_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  grafana_data:
  neo4j_data:
  redis_data:

networks:
  backend: